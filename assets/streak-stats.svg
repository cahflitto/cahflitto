<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 195" width="495px" height="195px">
  <style>
    .header { font: 700 28px 'Segoe UI', Ubuntu, -apple-system, sans-serif; fill: #70A5FD; }
    .label { font: 600 14px 'Segoe UI', Ubuntu, -apple-system, sans-serif; fill: #38BDAE; }
    .date { font: 400 12px 'Segoe UI', Ubuntu, -apple-system, sans-serif; fill: #7982a9; }
    .fire { fill: #FF6961; }
    .ring { stroke: #70A5FD; stroke-width: 5; fill: none; stroke-linecap: round; }
  </style>

  <rect x="0.5" y="0.5" rx="8" width="494" height="194" fill="#1A1B27" stroke="#1F2335" stroke-width="1"/>

  <!-- Dividers -->
  <line x1="165" y1="28" x2="165" y2="170" stroke="#2a2e45" stroke-width="1"/>
  <line x1="330" y1="28" x2="330" y2="170" stroke="#2a2e45" stroke-width="1"/>

  <!-- Total Contributions (Col 1) -->
  <g transform="translate(82, 60)" text-anchor="middle">
    <text y="20" class="header">3,420+</text>
    <text y="52" class="label">Total Contributions</text>
    <text y="78" class="date">Aug 20, 2022 – Present</text>
  </g>

  <!-- Current Streak (Col 2 - Highlighted) -->
  <g transform="translate(247, 50)" text-anchor="middle">
    <!-- Fire Icon -->
    <circle cx="0" cy="-10" r="18" fill="#FF6961" fill-opacity="0.15" />
    <path class="fire" transform="translate(-10, -20) scale(1.2)" d="M5.5 0C4 2 2.5 4 2.5 7a6 6 0 0012 0c0-3-1.5-5-3-7-.5 1-1.5 2-2.5 2.5C8 2 7 1 5.5 0z"/>
    <text y="30" class="header" fill="#FF8B80">64</text>
    <text y="62" class="label" fill="#FF8B80">Current Streak</text>
    <text y="88" class="date">Jul 7 – Present</text>
  </g>

  <!-- Longest Streak (Col 3) -->
  <g transform="translate(412, 60)" text-anchor="middle">
    <text y="20" class="header">218</text>
    <text y="52" class="label">Longest Streak</text>
    <text y="78" class="date">Oct 12 – May 18</text>
  </g>
</svg>
